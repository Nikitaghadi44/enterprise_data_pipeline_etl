version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: analytics_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_DATABASE: ${DB_NAME:-analytics_platform}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build: .
    container_name: analytics_dashboard
    restart: unless-stopped
    command: ["python", "main.py", "dashboard"]
    environment:
      DB_ENGINE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-analytics_platform}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./exports:/app/exports

  scheduler:
    build: .
    container_name: analytics_scheduler
    restart: unless-stopped
    command: ["python", "main.py", "schedule"]
    environment:
      DB_ENGINE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-analytics_platform}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      ETL_INTERVAL_MINUTES: ${ETL_INTERVAL_MINUTES:-5}
      REPORT_INTERVAL_HOURS: ${REPORT_INTERVAL_HOURS:-24}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./exports:/app/exports

volumes:
  mysql_data:
